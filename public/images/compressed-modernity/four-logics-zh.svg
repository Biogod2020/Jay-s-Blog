<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img" aria-labelledby="title desc"><title id="title">四种逻辑 / Four institutional logics</title><desc id="desc">An analytical framework in which professional standards, academic requirements, organizational hierarchy, and student status converge on one trainee. Not an empirical causal estimate.</desc><g font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif"><rect x="0" y="0" width="900" height="760" rx="0" fill="#f5f1e8" stroke="none"/><text x="48" y="55" font-size="32" fill="#203c43" font-weight="700" text-anchor="start">02 / 四种逻辑，一名年轻人</text><text x="48" y="96" font-size="22" fill="#576d72" font-weight="400" text-anchor="start">变化不只来自速度，也来自同时存在的不同规则。</text><rect x="48" y="130" width="386" height="188" rx="12" fill="#fffdf8" stroke="#c9d0ca"/><rect x="48" y="130" width="7" height="188" rx="0" fill="#2b7378" stroke="none"/><text x="71" y="178" font-size="28" fill="#2b7378" font-weight="700" text-anchor="start">专业标准</text><text x="71" y="226" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">规范诊疗</text><text x="71" y="261" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">胜任力与患者安全</text><rect x="466" y="130" width="386" height="188" rx="12" fill="#fffdf8" stroke="#c9d0ca"/><rect x="466" y="130" width="7" height="188" rx="0" fill="#ab493b" stroke="none"/><text x="489" y="178" font-size="28" fill="#ab493b" font-weight="700" text-anchor="start">学位科研</text><text x="489" y="226" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">课程与论文</text><text x="489" y="261" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">成果与职业筛选</text><rect x="48" y="430" width="386" height="188" rx="12" fill="#fffdf8" stroke="#c9d0ca"/><rect x="48" y="430" width="7" height="188" rx="0" fill="#ab493b" stroke="none"/><text x="71" y="478" font-size="28" fill="#ab493b" font-weight="700" text-anchor="start">层级关系</text><text x="71" y="526" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">资历与服从</text><text x="71" y="561" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">评价与机会分配</text><rect x="466" y="430" width="386" height="188" rx="12" fill="#fffdf8" stroke="#c9d0ca"/><rect x="466" y="430" width="7" height="188" rx="0" fill="#2b7378" stroke="none"/><text x="489" y="478" font-size="28" fill="#2b7378" font-weight="700" text-anchor="start">学生身份</text><text x="489" y="526" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">培养中的成员</text><text x="489" y="561" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">待遇与边界待明确</text><path d="M241,318 L390,365" fill="none" stroke="#91a39c" stroke-width="2"/><path d="M659,318 L510,365" fill="none" stroke="#91a39c" stroke-width="2"/><path d="M241,430 L390,385" fill="none" stroke="#91a39c" stroke-width="2"/><path d="M659,430 L510,385" fill="none" stroke="#91a39c" stroke-width="2"/><rect x="297" y="339" width="306" height="72" rx="36" fill="#203c43" stroke="none"/><text x="450" y="385" font-size="25" fill="#fffdf8" font-weight="600" text-anchor="middle">同一个人，同一天</text><path d="M48,662 L852,662" fill="none" stroke="#c9d0ca" stroke-width="1"/><text x="48" y="700" font-size="20" fill="#576d72" font-weight="400" text-anchor="start">作者的机制框架；不是对所有医院的描述，也不是因果效应估计。</text></g></svg>
