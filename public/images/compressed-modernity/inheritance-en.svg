<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="title desc"><title id="title">Selective inheritance</title><desc id="desc">An analytical framework, not a causal estimate or a description of every hospital.</desc><rect width="1000" height="1260" fill="#f5f1e8"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif">
<text x="48" y="61" font-size="21" fill="#ab493b" font-weight="700">INSTITUTIONS / SELECTIVE INHERITANCE</text>
<text x="48" y="118" font-size="35" fill="#203c43" font-weight="700">What travels forward—and what does not</text>
<text x="48" y="164" font-size="23" fill="#576d72" font-weight="400">An analytical framework, not a measured causal model.</text>
<rect x="48" y="205" width="904" height="125" rx="8" fill="#203c43"/>
<text x="75" y="250" font-size="27" fill="#f5f1e8" font-weight="700">Clinical apprenticeship + work-unit authority</text>
<text x="75" y="294" font-size="27" fill="#f5f1e8" font-weight="700">+ market employment + standardised credentials</text>
<path d="M500,330 L500,368" fill="none" stroke="#203c43" stroke-width="3"/>
<path d="M273,369 L727,369" fill="none" stroke="#203c43" stroke-width="2"/>
<path d="M273,369 L273,396" fill="none" stroke="#203c43" stroke-width="2"/>
<path d="M727,369 L727,396" fill="none" stroke="#203c43" stroke-width="2"/>
<rect x="48" y="396" width="432" height="250" rx="8" fill="#e0e6df"/>
<rect x="520" y="396" width="432" height="250" rx="8" fill="#eadbd0"/>
<text x="74" y="438" font-size="23" fill="#203c43" font-weight="700">EASIER TO REPRODUCE</text>
<text x="74" y="491" font-size="24" fill="#203c43" font-weight="400">Availability and attendance</text>
<text x="74" y="539" font-size="24" fill="#203c43" font-weight="400">Permission and hierarchy</text>
<text x="74" y="587" font-size="24" fill="#203c43" font-weight="400">Assessment-linked compliance</text>
<text x="546" y="438" font-size="23" fill="#ab493b" font-weight="700">REWRITTEN CONNECTIONS</text>
<text x="546" y="491" font-size="24" fill="#203c43" font-weight="400">Who arranges employment</text>
<text x="546" y="539" font-size="24" fill="#203c43" font-weight="400">How housing is paid for</text>
<text x="546" y="587" font-size="24" fill="#203c43" font-weight="400">Who carries transition risk</text>
<text x="48" y="704" font-size="23" fill="#ab493b" font-weight="700">HOW THE ARRANGEMENT PERSISTS</text>
<rect x="48" y="735" width="432" height="108" rx="8" fill="#e0e6df"/>
<text x="70" y="774" font-size="25" fill="#ab493b" font-weight="700">01</text>
<text x="129" y="773" font-size="23" fill="#203c43" font-weight="400">Rules are easy to copy</text>
<text x="129" y="810" font-size="23" fill="#203c43" font-weight="400">Teaching needs investment</text>
<rect x="520" y="735" width="432" height="108" rx="8" fill="#e0e6df"/>
<text x="542" y="774" font-size="25" fill="#ab493b" font-weight="700">02</text>
<text x="601" y="773" font-size="23" fill="#203c43" font-weight="400">Staffing depends on it</text>
<text x="601" y="810" font-size="23" fill="#203c43" font-weight="400">Old rules find new uses</text>
<rect x="48" y="863" width="432" height="108" rx="8" fill="#e0e6df"/>
<text x="70" y="902" font-size="25" fill="#ab493b" font-weight="700">03</text>
<text x="129" y="901" font-size="23" fill="#203c43" font-weight="400">Assessment and exit costs</text>
<text x="129" y="938" font-size="23" fill="#203c43" font-weight="400">Refusal has a price</text>
<rect x="520" y="863" width="432" height="108" rx="8" fill="#e0e6df"/>
<text x="542" y="902" font-size="25" fill="#ab493b" font-weight="700">04</text>
<text x="601" y="901" font-size="23" fill="#203c43" font-weight="400">Successful insiders speak</text>
<text x="601" y="938" font-size="23" fill="#203c43" font-weight="400">Experience becomes duty</text>
<path d="M500,992 L500,1030" fill="none" stroke="#203c43" stroke-width="3"/>
<rect x="48" y="1030" width="904" height="135" rx="8" fill="#203c43"/>
<text x="75" y="1076" font-size="27" fill="#f5f1e8" font-weight="700">One trainee: close institutional control,</text>
<text x="75" y="1121" font-size="27" fill="#f5f1e8" font-weight="700">overlapping demands and personal exposure to risk.</text>
<text x="48" y="1222" font-size="20" fill="#576d72" font-weight="400">Author’s analysis · compare institutions to test these mechanisms</text>
</g></svg>