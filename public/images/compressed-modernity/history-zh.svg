<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1850" viewBox="0 0 1000 1850" role="img" aria-labelledby="title desc"><title id="title">一份不断改写的制度契约</title><desc id="desc">历史节点示意；不同制度分线演进，并非从旧到新完整替代。节点不按时间比例排列。</desc><rect width="1000" height="1850" fill="#f5f1e8"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif">
<text x="48" y="60" font-size="21" fill="#ab493b" font-weight="700">HISTORY / 1889–2021</text>
<text x="48" y="116" font-size="35" fill="#203c43" font-weight="700">留下来的要求，改变了的交换条件</text>
<text x="48" y="160" font-size="22" fill="#576d72" font-weight="400">不是一套制度从过去完整走来，而是多条改革线索在今天相遇。</text>
<text x="48" y="194" font-size="22" fill="#576d72" font-weight="400">历史节点不按时间比例排列；具体文件及适用范围见正文参考资料。</text>
<path d="M220,250 L220,1728" fill="none" stroke="#c9d0ca" stroke-width="3"/>
<circle cx="220" cy="270" r="7" fill="#203c43"/>
<text x="48" y="278" font-size="24" fill="#ab493b" font-weight="700">1889 / 1921</text>
<text x="256" y="278" font-size="29" fill="#203c43" font-weight="700">住院式训练建立与传入</text>
<text x="256" y="323" font-size="25" fill="#576d72" font-weight="400">连续观察、分级监督、临床学习</text>
<path d="M256,355 L950,355" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="407" r="7" fill="#203c43"/>
<text x="48" y="415" font-size="24" fill="#ab493b" font-weight="700">1951</text>
<text x="256" y="415" font-size="29" fill="#203c43" font-weight="700">国家培养与就业配置相连</text>
<text x="256" y="460" font-size="25" fill="#576d72" font-weight="400">高等学校毕业生工作由政府分配</text>
<path d="M256,492 L950,492" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="544" r="7" fill="#203c43"/>
<text x="48" y="552" font-size="24" fill="#ab493b" font-weight="700">1962</text>
<text x="256" y="552" font-size="29" fill="#203c43" font-weight="700">住院医师培养计划</text>
<text x="256" y="597" font-size="25" fill="#576d72" font-weight="400">选拔优秀毕业生，培养师资与骨干</text>
<path d="M256,629 L950,629" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="681" r="7" fill="#ab493b"/>
<text x="48" y="689" font-size="24" fill="#ab493b" font-weight="700">1985</text>
<text x="256" y="689" font-size="29" fill="#203c43" font-weight="700">医院运行方式改革</text>
<text x="256" y="734" font-size="25" fill="#576d72" font-weight="400">扩大自主权，强调责权利与效率</text>
<path d="M256,766 L950,766" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="818" r="7" fill="#203c43"/>
<text x="48" y="826" font-size="24" fill="#ab493b" font-weight="700">1990</text>
<text x="256" y="826" font-size="29" fill="#203c43" font-weight="700">就业安排的承诺仍在</text>
<text x="256" y="871" font-size="25" fill="#576d72" font-weight="400">对符合条件、服从安排者负责分配</text>
<path d="M256,903 L950,903" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="955" r="7" fill="#ab493b"/>
<text x="48" y="963" font-size="24" fill="#ab493b" font-weight="700">1993 / 1994</text>
<text x="256" y="963" font-size="29" fill="#203c43" font-weight="700">住培训练试行；教育就业转轨</text>
<text x="256" y="1008" font-size="25" fill="#576d72" font-weight="400">培训标准扩展，自主择业逐步推进</text>
<path d="M256,1040 L950,1040" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="1092" r="7" fill="#ab493b"/>
<text x="48" y="1100" font-size="24" fill="#ab493b" font-weight="700">1998</text>
<text x="256" y="1100" font-size="29" fill="#203c43" font-weight="700">城镇住房分配货币化</text>
<text x="256" y="1145" font-size="25" fill="#576d72" font-weight="400">停止实物分房，生活账本改变</text>
<path d="M256,1177 L950,1177" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="1229" r="7" fill="#203c43"/>
<text x="48" y="1237" font-size="24" fill="#ab493b" font-weight="700">2010</text>
<text x="256" y="1237" font-size="29" fill="#203c43" font-weight="700">上海建立公共培训平台</text>
<text x="256" y="1282" font-size="25" fill="#576d72" font-weight="400">面向行业培养，也需衔接二次就业</text>
<path d="M256,1314 L950,1314" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="1366" r="7" fill="#203c43"/>
<text x="48" y="1374" font-size="24" fill="#ab493b" font-weight="700">2013</text>
<text x="256" y="1374" font-size="29" fill="#203c43" font-weight="700">住培走向全国制度化</text>
<text x="256" y="1419" font-size="25" fill="#576d72" font-weight="400">从局部实践走向行业共同标准</text>
<path d="M256,1451 L950,1451" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="1503" r="7" fill="#ab493b"/>
<text x="48" y="1511" font-size="24" fill="#ab493b" font-weight="700">2014 / 2015</text>
<text x="256" y="1511" font-size="29" fill="#203c43" font-weight="700">专业硕士与住培衔接</text>
<text x="256" y="1556" font-size="25" fill="#576d72" font-weight="400">三年里连接临床、课程与学位任务</text>
<path d="M256,1588 L950,1588" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="1640" r="7" fill="#203c43"/>
<text x="48" y="1648" font-size="24" fill="#ab493b" font-weight="700">2021</text>
<text x="256" y="1648" font-size="29" fill="#203c43" font-weight="700">“两个同等对待”</text>
<text x="256" y="1693" font-size="25" fill="#576d72" font-weight="400">修补结业资历与招聘待遇的接口</text>
<path d="M256,1725 L950,1725" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<path d="M48,1785 L952,1785" fill="none" stroke="#c9d0ca" stroke-width="2"/>
<text x="48" y="1820" font-size="20" fill="#576d72" font-weight="400">历史资料综合 · 原创图解 · Jay’s Blog</text>
</g></svg>