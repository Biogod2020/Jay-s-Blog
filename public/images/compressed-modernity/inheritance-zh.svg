<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="title desc"><title id="title">制度不是照搬，而是选择性传承</title><desc id="desc">作者分析框架，非实证因果估计；不代表每家医院均符合图中机制。</desc><rect width="1000" height="1260" fill="#f5f1e8"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif">
<text x="48" y="61" font-size="21" fill="#ab493b" font-weight="700">INSTITUTIONS / SELECTIVE INHERITANCE</text>
<text x="48" y="118" font-size="35" fill="#203c43" font-weight="700">制度怎样穿过几代人，落到一个人身上</text>
<text x="48" y="164" font-size="23" fill="#576d72" font-weight="400">关键不只是传统还在，而是谁在复制规则、支付成本。</text>
<rect x="48" y="205" width="904" height="125" rx="8" fill="#203c43"/>
<text x="75" y="250" font-size="27" fill="#f5f1e8" font-weight="700">临床学徒制 ＋ 单位式管理</text>
<text x="75" y="294" font-size="27" fill="#f5f1e8" font-weight="700">＋ 市场化就业 ＋ 标准化资质与学位要求</text>
<path d="M500,330 L500,368" fill="none" stroke="#203c43" stroke-width="3"/>
<path d="M273,369 L727,369" fill="none" stroke="#203c43" stroke-width="2"/>
<path d="M273,369 L273,396" fill="none" stroke="#203c43" stroke-width="2"/>
<path d="M727,369 L727,396" fill="none" stroke="#203c43" stroke-width="2"/>
<rect x="48" y="396" width="432" height="250" rx="8" fill="#e0e6df"/>
<rect x="520" y="396" width="432" height="250" rx="8" fill="#eadbd0"/>
<text x="74" y="438" font-size="23" fill="#203c43" font-weight="700">容易延续的组织要求</text>
<text x="74" y="491" font-size="24" fill="#203c43" font-weight="400">长时间在场与考勤</text>
<text x="74" y="539" font-size="24" fill="#203c43" font-weight="400">层级审批与任务分配</text>
<text x="74" y="587" font-size="24" fill="#203c43" font-weight="400">过程评价中的服从要求</text>
<text x="546" y="438" font-size="23" fill="#ab493b" font-weight="700">已被改写的配套条件</text>
<text x="546" y="491" font-size="24" fill="#203c43" font-weight="400">就业由谁安排</text>
<text x="546" y="539" font-size="24" fill="#203c43" font-weight="400">住房怎样获得</text>
<text x="546" y="587" font-size="24" fill="#203c43" font-weight="400">过渡期风险由谁承担</text>
<text x="48" y="704" font-size="23" fill="#ab493b" font-weight="700">不是自动延续，而是经由四种机制</text>
<rect x="48" y="735" width="432" height="108" rx="8" fill="#e0e6df"/>
<text x="70" y="774" font-size="25" fill="#ab493b" font-weight="700">01</text>
<text x="129" y="773" font-size="23" fill="#203c43" font-weight="400">规则可复制</text>
<text x="129" y="810" font-size="23" fill="#203c43" font-weight="400">指导须重新投入</text>
<rect x="520" y="735" width="432" height="108" rx="8" fill="#e0e6df"/>
<text x="542" y="774" font-size="25" fill="#ab493b" font-weight="700">02</text>
<text x="601" y="773" font-size="23" fill="#203c43" font-weight="400">人员预算依赖</text>
<text x="601" y="810" font-size="23" fill="#203c43" font-weight="400">传统被现实再使用</text>
<rect x="48" y="863" width="432" height="108" rx="8" fill="#e0e6df"/>
<text x="70" y="902" font-size="25" fill="#ab493b" font-weight="700">03</text>
<text x="129" y="901" font-size="23" fill="#203c43" font-weight="400">评价权与退出成本</text>
<text x="129" y="938" font-size="23" fill="#203c43" font-weight="400">拒绝有现实代价</text>
<rect x="520" y="863" width="432" height="108" rx="8" fill="#e0e6df"/>
<text x="542" y="902" font-size="25" fill="#ab493b" font-weight="700">04</text>
<text x="601" y="901" font-size="23" fill="#203c43" font-weight="400">成功者讲述过去</text>
<text x="601" y="938" font-size="23" fill="#203c43" font-weight="400">经验被筛选成道德</text>
<path d="M500,992 L500,1030" fill="none" stroke="#203c43" stroke-width="3"/>
<rect x="48" y="1030" width="904" height="135" rx="8" fill="#203c43"/>
<text x="75" y="1076" font-size="27" fill="#f5f1e8" font-weight="700">同一个年轻人：高组织控制、多重任务叠加</text>
<text x="75" y="1121" font-size="27" fill="#f5f1e8" font-weight="700">以及越来越需要个人承担的生活与职业风险</text>
<text x="48" y="1222" font-size="20" fill="#576d72" font-weight="400">作者分析示意 · 具体机制仍需跨机构、跨时期比较检验</text>
</g></svg>