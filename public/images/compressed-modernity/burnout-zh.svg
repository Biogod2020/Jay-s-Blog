<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" role="img" aria-labelledby="title desc"><title id="title">倦怠问卷结果 / Burnout survey results</title><desc id="desc">Any-degree burnout: 83.13%. Moderate or severe burnout: 37.5% of the same 504 respondents and a subset of the first group. Data: April 2025, four southern China hospitals. Jiang et al., published August 2026, DOI 10.1371/journal.pone.0356791. Not nationally representative.</desc><g font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif"><rect x="0" y="0" width="900" height="550" rx="0" fill="#f5f1e8" stroke="none"/><text x="48" y="55" font-size="32" fill="#203c43" font-weight="700" text-anchor="start">03 / 看见压力，也看清分母</text><text x="48" y="98" font-size="21" fill="#576d72" font-weight="400" text-anchor="start">504份有效问卷 · 中国南方四家医院 · 2025年调查</text><text x="70" y="158" font-size="24" fill="#203c43" font-weight="600" text-anchor="start">任意程度倦怠（含轻度）</text><rect x="70" y="178" width="760" height="52" rx="4" fill="#dfe4dd" stroke="none"/><rect x="70" y="178" width="631.788" height="52" rx="4" fill="#2b7378" stroke="none"/><text x="815" y="215" font-size="28" fill="#203c43" font-weight="700" text-anchor="end">83.13%</text><text x="70" y="281" font-size="24" fill="#203c43" font-weight="600" text-anchor="start">中重度倦怠（上述人群的子集）</text><rect x="70" y="300" width="760" height="52" rx="4" fill="#dfe4dd" stroke="none"/><rect x="70" y="300" width="285.0" height="52" rx="4" fill="#ab493b" stroke="none"/><text x="815" y="337" font-size="28" fill="#203c43" font-weight="700" text-anchor="end">37.50%</text><path d="M70.0,366 L70.0,373" fill="none" stroke="#576d72" stroke-width="1"/><text x="70.0" y="397" font-size="18" fill="#576d72" font-weight="400" text-anchor="middle">0%</text><path d="M260.0,366 L260.0,373" fill="none" stroke="#576d72" stroke-width="1"/><text x="260.0" y="397" font-size="18" fill="#576d72" font-weight="400" text-anchor="middle">25%</text><path d="M450.0,366 L450.0,373" fill="none" stroke="#576d72" stroke-width="1"/><text x="450.0" y="397" font-size="18" fill="#576d72" font-weight="400" text-anchor="middle">50%</text><path d="M640.0,366 L640.0,373" fill="none" stroke="#576d72" stroke-width="1"/><text x="640.0" y="397" font-size="18" fill="#576d72" font-weight="400" text-anchor="middle">75%</text><path d="M830.0,366 L830.0,373" fill="none" stroke="#576d72" stroke-width="1"/><text x="830.0" y="397" font-size="18" fill="#576d72" font-weight="400" text-anchor="middle">100%</text><path d="M48,426 L852,426" fill="none" stroke="#c9d0ca" stroke-width="1"/><text x="48" y="463" font-size="19" fill="#576d72" font-weight="400" text-anchor="start">同一分母；后者包含在前者中，两条不能相加。</text><text x="48" y="492" font-size="19" fill="#576d72" font-weight="400" text-anchor="start">非全国代表性样本；横断面研究不能确定因果方向。</text><text x="48" y="521" font-size="19" fill="#576d72" font-weight="400" text-anchor="start">来源：Jiang et al., PLOS ONE, 2026 · 10.1371/journal.pone.0356791</text></g></svg>
