<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img" aria-labelledby="title desc"><title id="title">四种逻辑 / Four institutional logics</title><desc id="desc">An analytical framework in which professional standards, academic requirements, organizational hierarchy, and student status converge on one trainee. Not an empirical causal estimate.</desc><g font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif"><rect x="0" y="0" width="900" height="760" rx="0" fill="#f5f1e8" stroke="none"/><text x="48" y="55" font-size="32" fill="#203c43" font-weight="700" text-anchor="start">02 / Four logics. One young person.</text><text x="48" y="96" font-size="22" fill="#576d72" font-weight="400" text-anchor="start">Different rules coexist. Their boundaries do not align.</text><rect x="48" y="130" width="386" height="188" rx="12" fill="#fffdf8" stroke="#c9d0ca"/><rect x="48" y="130" width="7" height="188" rx="0" fill="#2b7378" stroke="none"/><text x="71" y="178" font-size="28" fill="#2b7378" font-weight="700" text-anchor="start">Professional standards</text><text x="71" y="226" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">Reliable clinical care</text><text x="71" y="261" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">Competence and patient safety</text><rect x="466" y="130" width="386" height="188" rx="12" fill="#fffdf8" stroke="#c9d0ca"/><rect x="466" y="130" width="7" height="188" rx="0" fill="#ab493b" stroke="none"/><text x="489" y="178" font-size="28" fill="#ab493b" font-weight="700" text-anchor="start">Academic requirements</text><text x="489" y="226" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">Courses and a thesis</text><text x="489" y="261" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">Research and career selection</text><rect x="48" y="430" width="386" height="188" rx="12" fill="#fffdf8" stroke="#c9d0ca"/><rect x="48" y="430" width="7" height="188" rx="0" fill="#ab493b" stroke="none"/><text x="71" y="478" font-size="28" fill="#ab493b" font-weight="700" text-anchor="start">Organizational hierarchy</text><text x="71" y="526" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">Seniority and deference</text><text x="71" y="561" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">Assessments and opportunities</text><rect x="466" y="430" width="386" height="188" rx="12" fill="#fffdf8" stroke="#c9d0ca"/><rect x="466" y="430" width="7" height="188" rx="0" fill="#2b7378" stroke="none"/><text x="489" y="478" font-size="28" fill="#2b7378" font-weight="700" text-anchor="start">Student status</text><text x="489" y="526" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">Still “in training”</text><text x="489" y="561" font-size="23" fill="#203c43" font-weight="400" text-anchor="start">Pay and boundaries unsettled</text><path d="M241,318 L390,365" fill="none" stroke="#91a39c" stroke-width="2"/><path d="M659,318 L510,365" fill="none" stroke="#91a39c" stroke-width="2"/><path d="M241,430 L390,385" fill="none" stroke="#91a39c" stroke-width="2"/><path d="M659,430 L510,385" fill="none" stroke="#91a39c" stroke-width="2"/><rect x="297" y="339" width="306" height="72" rx="36" fill="#203c43" stroke="none"/><text x="450" y="385" font-size="25" fill="#fffdf8" font-weight="600" text-anchor="middle">One person. One day.</text><path d="M48,662 L852,662" fill="none" stroke="#c9d0ca" stroke-width="1"/><text x="48" y="700" font-size="20" fill="#576d72" font-weight="400" text-anchor="start">An analytical framework—not an estimate of causal effects.</text></g></svg>
