<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="title desc"><title id="title">双轨培养 / Dual-track training</title><desc id="desc">At least 33 months of clinical training within a three-year professional master’s program, overlapping with academic requirements. Based on the 2015 national curriculum.</desc><g font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif"><rect x="0" y="0" width="900" height="540" rx="0" fill="#f5f1e8" stroke="none"/><text x="48" y="55" font-size="32" fill="#203c43" font-weight="700" text-anchor="start">01 / 两条任务线，共用三年</text><text x="48" y="96" font-size="22" fill="#576d72" font-weight="400" text-anchor="start">并轨减少串行耗时，不自动减少每一项要求。</text><path d="M70,159 L830,159" fill="none" stroke="#203c43" stroke-width="2"/><path d="M70.0,153 L70.0,166" fill="none" stroke="#203c43" stroke-width="2"/><text x="70.0" y="140" font-size="20" fill="#576d72" font-weight="400" text-anchor="middle">入学</text><path d="M323.33333333333337,153 L323.33333333333337,166" fill="none" stroke="#203c43" stroke-width="2"/><text x="323.33333333333337" y="140" font-size="20" fill="#576d72" font-weight="400" text-anchor="middle">12个月</text><path d="M576.6666666666667,153 L576.6666666666667,166" fill="none" stroke="#203c43" stroke-width="2"/><text x="576.6666666666667" y="140" font-size="20" fill="#576d72" font-weight="400" text-anchor="middle">24个月</text><path d="M830.0,153 L830.0,166" fill="none" stroke="#203c43" stroke-width="2"/><text x="830.0" y="140" font-size="20" fill="#576d72" font-weight="400" text-anchor="middle">36个月</text><text x="70" y="210" font-size="25" fill="#203c43" font-weight="700" text-anchor="start">临床培训</text><rect x="70" y="228" width="760" height="64" rx="8" fill="#e0e6df" stroke="none"/><rect x="70" y="228" width="696.6666666666666" height="64" rx="8" fill="#2b7378" stroke="none"/><text x="88" y="269" font-size="26" fill="#fffdf8" font-weight="600" text-anchor="start">至少33个月实际培训</text><text x="70" y="336" font-size="25" fill="#203c43" font-weight="700" text-anchor="start">学位要求（与轮转交叠）</text><rect x="70" y="354" width="760" height="63" rx="8" fill="#eadbd0" stroke="none"/><text x="88" y="394" font-size="24" fill="#ab493b" font-weight="600" text-anchor="start">课程  ·  研究训练  ·  学位论文</text><path d="M70,447 L830,447" fill="none" stroke="#c9d0ca" stroke-width="1"/><text x="70" y="480" font-size="20" fill="#576d72" font-weight="400" text-anchor="start">示意，非排班。条形只表示总时长；空白不代表假期。</text><text x="70" y="509" font-size="20" fill="#576d72" font-weight="400" text-anchor="start">依据：2015年临床医学硕士专业学位指导性培养方案。</text></g></svg>
