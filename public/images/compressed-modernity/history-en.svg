<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1850" viewBox="0 0 1000 1850" role="img" aria-labelledby="title desc"><title id="title">A changing bargain</title><desc id="desc">Selected historical milestones, not an uninterrupted legal lineage. Time spacing is schematic.</desc><rect width="1000" height="1850" fill="#f5f1e8"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif">
<text x="48" y="60" font-size="21" fill="#ab493b" font-weight="700">HISTORY / 1889–2021</text>
<text x="48" y="116" font-size="35" fill="#203c43" font-weight="700">The obligations changed. So did the bargain.</text>
<text x="48" y="160" font-size="22" fill="#576d72" font-weight="400">Selected milestones. Different reforms—not one unbroken institution.</text>
<text x="48" y="194" font-size="22" fill="#576d72" font-weight="400">Dates are not spaced to scale. Full sources appear in the article.</text>
<path d="M220,250 L220,1728" fill="none" stroke="#c9d0ca" stroke-width="3"/>
<circle cx="220" cy="270" r="7" fill="#203c43"/>
<text x="48" y="278" font-size="24" fill="#ab493b" font-weight="700">1889 / 1921</text>
<text x="256" y="278" font-size="29" fill="#203c43" font-weight="700">Residential training takes shape</text>
<text x="256" y="323" font-size="25" fill="#576d72" font-weight="400">Clinical immersion with supervision</text>
<path d="M256,355 L950,355" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="407" r="7" fill="#203c43"/>
<text x="48" y="415" font-size="24" fill="#ab493b" font-weight="700">1951</text>
<text x="256" y="415" font-size="29" fill="#203c43" font-weight="700">Education linked to job allocation</text>
<text x="256" y="460" font-size="25" fill="#576d72" font-weight="400">Government placement for graduates</text>
<path d="M256,492 L950,492" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="544" r="7" fill="#203c43"/>
<text x="48" y="552" font-size="24" fill="#ab493b" font-weight="700">1962</text>
<text x="256" y="552" font-size="29" fill="#203c43" font-weight="700">A plan to develop clinical leaders</text>
<text x="256" y="597" font-size="25" fill="#576d72" font-weight="400">Selected graduates trained as a core</text>
<path d="M256,629 L950,629" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="681" r="7" fill="#ab493b"/>
<text x="48" y="689" font-size="24" fill="#ab493b" font-weight="700">1985</text>
<text x="256" y="689" font-size="29" fill="#203c43" font-weight="700">Hospital operating reform</text>
<text x="256" y="734" font-size="25" fill="#576d72" font-weight="400">More autonomy and stronger incentives</text>
<path d="M256,766 L950,766" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="818" r="7" fill="#203c43"/>
<text x="48" y="826" font-size="24" fill="#ab493b" font-weight="700">1990</text>
<text x="256" y="826" font-size="29" fill="#203c43" font-weight="700">Placement commitment reaffirmed</text>
<text x="256" y="871" font-size="25" fill="#576d72" font-weight="400">Conditional on eligibility and assignment</text>
<path d="M256,903 L950,903" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="955" r="7" fill="#ab493b"/>
<text x="48" y="963" font-size="24" fill="#ab493b" font-weight="700">1993 / 1994</text>
<text x="256" y="963" font-size="29" fill="#203c43" font-weight="700">Training trials; employment transition</text>
<text x="256" y="1008" font-size="25" fill="#576d72" font-weight="400">Common standards; phased job-seeking</text>
<path d="M256,1040 L950,1040" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="1092" r="7" fill="#ab493b"/>
<text x="48" y="1100" font-size="24" fill="#ab493b" font-weight="700">1998</text>
<text x="256" y="1100" font-size="29" fill="#203c43" font-weight="700">Urban housing becomes monetised</text>
<text x="256" y="1145" font-size="25" fill="#576d72" font-weight="400">An end to new in-kind allocation</text>
<path d="M256,1177 L950,1177" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="1229" r="7" fill="#203c43"/>
<text x="48" y="1237" font-size="24" fill="#ab493b" font-weight="700">2010</text>
<text x="256" y="1237" font-size="29" fill="#203c43" font-weight="700">Shanghai builds a common platform</text>
<text x="256" y="1282" font-size="25" fill="#576d72" font-weight="400">Training portability; a new job search</text>
<path d="M256,1314 L950,1314" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="1366" r="7" fill="#203c43"/>
<text x="48" y="1374" font-size="24" fill="#ab493b" font-weight="700">2013</text>
<text x="256" y="1374" font-size="29" fill="#203c43" font-weight="700">Residency becomes a national system</text>
<text x="256" y="1419" font-size="25" fill="#576d72" font-weight="400">An industry-wide baseline of competence</text>
<path d="M256,1451 L950,1451" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="1503" r="7" fill="#ab493b"/>
<text x="48" y="1511" font-size="24" fill="#ab493b" font-weight="700">2014 / 2015</text>
<text x="256" y="1511" font-size="29" fill="#203c43" font-weight="700">Master’s and residency are integrated</text>
<text x="256" y="1556" font-size="25" fill="#576d72" font-weight="400">Clinical and academic duties overlap</text>
<path d="M256,1588 L950,1588" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<circle cx="220" cy="1640" r="7" fill="#203c43"/>
<text x="48" y="1648" font-size="24" fill="#ab493b" font-weight="700">2021</text>
<text x="256" y="1648" font-size="29" fill="#203c43" font-weight="700">Two forms of equal treatment</text>
<text x="256" y="1693" font-size="25" fill="#576d72" font-weight="400">Repairing the training–employment link</text>
<path d="M256,1725 L950,1725" fill="none" stroke="#c9d0ca" stroke-width="1"/>
<path d="M48,1785 L952,1785" fill="none" stroke="#c9d0ca" stroke-width="2"/>
<text x="48" y="1820" font-size="20" fill="#576d72" font-weight="400">Historical synthesis · original diagram · Jay’s Blog</text>
</g></svg>