<meta name="description" content="基于单张参考照片程序化重建的复旦大学光华楼可交互 3D 模型。">
<style>
:root{color-scheme:light;--ink:#17332f;--muted:#5e746e;--panel:rgba(250,252,248,.88);--line:rgba(44,75,68,.15)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c8dce4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",Arial,sans-serif;color:var(--ink)}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.brand{position:absolute;left:28px;top:24px;pointer-events:none;text-shadow:0 1px 14px rgba(255,255,255,.5)}.kicker{font-size:10px;letter-spacing:.22em;font-weight:700;opacity:.72}.title{font-size:28px;letter-spacing:.18em;margin-top:6px;font-weight:650}.sub{font-size:10px;letter-spacing:.14em;margin-top:7px;color:var(--muted)}.panel{position:absolute;right:22px;top:20px;display:flex;gap:6px;padding:7px;border:1px solid rgba(255,255,255,.72);border-radius:14px;background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(26,56,50,.13)}button{border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;border-radius:9px;padding:9px 12px;font-size:11px;transition:.18s ease;white-space:nowrap}button:hover{background:#e4ece7}button.active{background:#244d42;color:#fff}.bottom{position:absolute;left:50%;bottom:21px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:7px;background:var(--panel);border:1px solid rgba(255,255,255,.7);border-radius:14px;backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(26,56,50,.14)}.divider{width:1px;height:23px;background:var(--line);margin:0 3px}.hint{position:absolute;left:27px;bottom:28px;font-size:10px;line-height:1.65;letter-spacing:.03em;color:#385b51;pointer-events:none}.credit{position:absolute;right:26px;bottom:28px;font-size:9px;letter-spacing:.08em;color:#46655d;pointer-events:none;text-align:right}.loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center;background:#edf2ee;z-index:20;transition:opacity .45s ease}.loading.hide{opacity:0;pointer-events:none}.loadmark{display:flex;align-items:flex-end;gap:7px;height:54px}.loadmark i{display:block;width:13px;background:#31564b;animation:p 1.2s infinite}.loadmark i:nth-child(1),.loadmark i:nth-child(3){height:54px}.loadmark i:nth-child(2){height:28px;animation-delay:.12s}.loadtext{font-size:10px;letter-spacing:.18em;color:#526d65}.error{display:none;position:absolute;inset:0;z-index:25;padding:28px;place-items:center;background:#eff2ed;text-align:center;color:#6c4d42}.error.show{display:grid}.error div{max-width:520px;line-height:1.8;font-size:13px}.night{--ink:#dce8e6;--muted:#b1c4c0;--panel:rgba(18,29,36,.84);--line:rgba(220,232,230,.16)}.night .hint,.night .credit{color:#c9d9d6}.night button:hover{background:rgba(255,255,255,.1)}@keyframes p{0%,100%{opacity:.5}50%{opacity:1}}@media(max-width:720px){.brand{left:17px;top:16px}.title{font-size:22px}.sub{display:none}.panel{right:12px;top:12px;padding:5px}.panel button{padding:8px 9px;font-size:0}.panel button::first-letter{font-size:12px}.bottom{bottom:12px;width:calc(100% - 24px);justify-content:center;padding:5px}.bottom button{padding:8px 9px;font-size:10px}.hint,.credit{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head><body><div id="app"><div class="loading" id="loading"><div class="loadmark"><i></i><i></i><i></i></div><div class="loadtext" id="loadtext">BUILDING GUANGHUA · 3D</div></div><div class="error" id="error"><div><strong>3D 模型加载失败</strong><br><span id="errorText"></span></div></div><div class="brand"><div class="kicker">FUDAN UNIVERSITY · SHANGHAI</div><div class="title">光华楼</div><div class="sub">GUANGHUA BUILDING · PHOTO-GUIDED 3D STUDY</div></div><div class="panel"><button id="autoBtn" title="自动旋转">↻ 自动旋转</button><button id="dayBtn" title="切换昼夜">☾ 夜景</button><button id="fullBtn" title="全屏">⛶ 全屏</button></div><div class="bottom"><button class="active" data-view="front">正面</button><button data-view="angle">斜侧</button><button data-view="aerial">鸟瞰</button><div class="divider"></div><button id="resetBtn">重置</button></div><div class="hint">拖动旋转 · 滚轮缩放 · 双指缩放<br>单张照片近似重建，非测绘 / BIM 模型</div><div class="credit">Jiahao Ji · 2026<br>WebGL / Three.js</div></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const DATA_URLS=['/interactive/guanghua-data/gh_model_part_00_0.txt','/interactive/guanghua-data/gh_model_part_00_1.txt','/interactive/guanghua-data/gh_model_part_00_2_0.txt','/interactive/guanghua-data/gh_model_part_00_2_1_0.txt','/interactive/guanghua-data/gh_model_part_00_2_1_1.txt','/interactive/guanghua-data/gh_model_part_00_2_1_2.txt','/interactive/guanghua-data/gh_model_part_00_2_1_3.txt','/interactive/guanghua-data/gh_model_part_00_2_1_4.txt','/interactive/guanghua-data/gh_model_part_00_3.txt','/interactive/guanghua-data/gh_model_part_01.txt','/interactive/guanghua-data/gh_model_part_02.txt','/interactive/guanghua-data/gh_model_part_03.txt'];
let MODEL_DATA_GZ_B64='';
const app=document.getElementById('app'),loading=document.getElementById('loading'),loadtext=document.getElementById('loadtext');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;app.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc6dce5);scene.fog=new THREE.Fog(0xc6dce5,270,610);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,1200);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.minDistance=78;controls.maxDistance=520;controls.minPolarAngle=.17;controls.maxPolarAngle=Math.PI*.49;const VIEWS={front:{p:[0,63,286],t:[0,50,0]},angle:{p:[185,101,235],t:[0,48,0]},aerial:{p:[205,205,220],t:[0,38,0]}};function setView(name){const v=VIEWS[name];camera.position.set(...v.p);controls.target.set(...v.t);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name))}setView('front');
const hemi=new THREE.HemisphereLight(0xf2fbff,0x526447,1.7);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff0d0,3.35);sun.position.set(-115,180,150);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-175;sun.shadow.camera.right=175;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-35;sun.shadow.camera.near=20;sun.shadow.camera.far=480;sun.shadow.bias=-.00018;scene.add(sun);const fill=new THREE.DirectionalLight(0xb9d8e8,.7);fill.position.set(150,85,80);scene.add(fill);
const mats=[];const glow=[];const unitCube=new THREE.BoxGeometry(1,1,1),unitCyl=new THREE.CylinderGeometry(1,1,1,8),unitLeaf=new THREE.IcosahedronGeometry(1,1);const root=new THREE.Group();scene.add(root);const up=new THREE.Vector3(0,1,0),tmpPos=new THREE.Vector3(),tmpScale=new THREE.Vector3(),tmpQ=new THREE.Quaternion(),tmpM=new THREE.Matrix4();
function coord(a){return new THREE.Vector3(a[0],a[2],-a[1])}function size(s){return new THREE.Vector3(s[0],s[2],s[1])}
function b64bytes(s){const raw=atob(s),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}async function gunzip(raw){if('DecompressionStream'in window){const ds=new DecompressionStream('gzip');return await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer()}const mod=await import('https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js');const out=mod.gunzipSync(raw);return out.buffer.slice(out.byteOffset,out.byteOffset+out.byteLength)}
function cubeMatrix(c,s,q=null){tmpPos.copy(coord(c));tmpScale.copy(size(s));tmpQ.copy(q||new THREE.Quaternion());tmpM.compose(tmpPos,tmpQ,tmpScale);return tmpM.clone()}
function beamMatrix(a,b,w,d){const A=coord(a),B=coord(b),mid=A.clone().add(B).multiplyScalar(.5),dir=B.clone().sub(A),len=dir.length();dir.normalize();const q=new THREE.Quaternion().setFromUnitVectors(up,dir);const sc=new THREE.Vector3(w,len,d||w);return new THREE.Matrix4().compose(mid,q,sc)}
function frustumMesh(cmd,mat){const[,name,,c,w0,d0,w1,d1,h]=cmd;const[x,y,z]=c;const p=[[x-w0/2,y-d0/2,z],[x+w0/2,y-d0/2,z],[x+w0/2,y+d0/2,z],[x-w0/2,y+d0/2,z],[x-w1/2,y-d1/2,z+h],[x+w1/2,y-d1/2,z+h],[x+w1/2,y+d1/2,z+h],[x-w1/2,y+d1/2,z+h]].map(coord);const idx=[0,3,2,0,2,1,4,5,6,4,6,7,0,1,5,0,5,4,1,2,6,1,6,5,2,3,7,2,7,6,3,0,4,3,4,7];const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p.flatMap(v=>[v.x,v.y,v.z]),3));g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,mat);m.name=name;m.castShadow=true;m.receiveShadow=true;root.add(m)}
async function build(){try{loadtext.textContent='LOADING MODEL';MODEL_DATA_GZ_B64=(await Promise.all(DATA_URLS.map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error(`HTTP ${r.status}: ${u}`);return r.text()}))).join('');loadtext.textContent='DECOMPRESSING MODEL';const buf=await gunzip(b64bytes(MODEL_DATA_GZ_B64));loadtext.textContent='BUILDING GEOMETRY';const data=JSON.parse(new TextDecoder().decode(buf));data.materials.forEach((m,i)=>{const p=m.pbrMetallicRoughness,c=p.baseColorFactor;const mm=new THREE.MeshStandardMaterial({name:m.name,color:new THREE.Color(c[0],c[1],c[2]),roughness:p.roughnessFactor??.7,metalness:p.metallicFactor??0});mats[i]=mm;glow[i]=Number(m.extras?.nightGlow||0)});const cubes=Array.from({length:mats.length},()=>[]),cyls=Array.from({length:mats.length},()=>[]),leaves=Array.from({length:mats.length},()=>[]);for(const cmd of data.commands){const t=cmd[0],mi=cmd[2];if(t==='b'){cubes[mi].push(cubeMatrix(cmd[3],cmd[4]))}else if(t==='m'){cubes[mi].push(beamMatrix(cmd[3],cmd[4],cmd[5],cmd[6]))}else if(t==='c'){const A=coord(cmd[3]),B=coord(cmd[4]),mid=A.clone().add(B).multiplyScalar(.5),dir=B.clone().sub(A),len=dir.length();dir.normalize();const q=new THREE.Quaternion().setFromUnitVectors(up,dir);const r=(Number(cmd[5])+(cmd[6]==null?Number(cmd[5]):Number(cmd[6])))*.5;cyls[mi].push(new THREE.Matrix4().compose(mid,q,new THREE.Vector3(r,len,r)))}else if(t==='y'){const c=coord(cmd[3]),r=cmd[4];leaves[mi].push(new THREE.Matrix4().compose(c,new THREE.Quaternion(),new THREE.Vector3(r[0],r[2],r[1])))}else if(t==='f')frustumMesh(cmd,mats[mi])}
for(let mi=0;mi<mats.length;mi++){if(cubes[mi].length){const mesh=new THREE.InstancedMesh(unitCube,mats[mi],cubes[mi].length);cubes[mi].forEach((m,i)=>mesh.setMatrixAt(i,m));mesh.instanceMatrix.needsUpdate=true;mesh.castShadow=!/Lawn|Paving|soil/i.test(mats[mi].name);mesh.receiveShadow=true;root.add(mesh)}if(cyls[mi].length){const mesh=new THREE.InstancedMesh(unitCyl,mats[mi],cyls[mi].length);cyls[mi].forEach((m,i)=>mesh.setMatrixAt(i,m));mesh.instanceMatrix.needsUpdate=true;mesh.castShadow=true;mesh.receiveShadow=true;root.add(mesh)}if(leaves[mi].length){const mesh=new THREE.InstancedMesh(unitLeaf,mats[mi],leaves[mi].length);leaves[mi].forEach((m,i)=>mesh.setMatrixAt(i,m));mesh.instanceMatrix.needsUpdate=true;mesh.castShadow=true;mesh.receiveShadow=true;root.add(mesh)}}loading.classList.add('hide');setTimeout(()=>loading.remove(),500)}catch(err){console.error(err);document.getElementById('errorText').textContent=err?.message||String(err);document.getElementById('error').classList.add('show')}}build();
let auto=false,night=false;document.getElementById('autoBtn').onclick=()=>{auto=!auto;controls.autoRotate=auto;controls.autoRotateSpeed=.62;document.getElementById('autoBtn').classList.toggle('active',auto)};document.getElementById('dayBtn').onclick=()=>{night=!night;document.body.classList.toggle('night',night);document.getElementById('dayBtn').textContent=night?'☀ 日景':'☾ 夜景';scene.background.set(night?0x07121d:0xc6dce5);scene.fog.color.set(night?0x07121d:0xc6dce5);hemi.intensity=night?.24:1.7;sun.intensity=night?.09:3.35;fill.intensity=night?.2:.7;renderer.toneMappingExposure=night?.72:1.03;mats.forEach((m,i)=>{const g=glow[i]||0;m.emissive.set(night&&g>0?0xcba761:0x000000);m.emissiveIntensity=night?g*.8:0;m.needsUpdate=true})};document.getElementById('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.getElementById('resetBtn').onclick=()=>setView('front');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();
</script></body></html>
