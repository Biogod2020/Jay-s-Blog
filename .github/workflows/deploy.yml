name: Build, check and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', '.memory/**', 'wechat_version/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore compiled CVs
        id: cv-cache
        uses: actions/cache@v4
        with:
          path: |
            cv/Jia-Hao_Ji_CV.pdf
            cv/Jia-Hao_Ji_Academic_CV.pdf
            cv/Jia-Hao_Ji_CV_zh.pdf
          key: cv-pdf-v2-${{ runner.os }}-${{ hashFiles('cv/*.tex', 'public/*.jpg', 'public/*.png') }}
      - name: Compile English CVs when sources change
        if: steps.cv-cache.outputs.cache-hit != 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            cv/Jia-Hao_Ji_CV.tex
            cv/Jia-Hao_Ji_Academic_CV.tex
          work_in_root_file_dir: true
          texlive_version: 2026
          os: debian
      - name: Compile Chinese CV when sources change
        if: steps.cv-cache.outputs.cache-hit != 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv/Jia-Hao_Ji_CV_zh.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
          texlive_version: 2026
          os: debian
      - name: Stage CV files and legacy URL
        run: |
          set -euo pipefail
          for name in Jia-Hao_Ji_CV Jia-Hao_Ji_Academic_CV Jia-Hao_Ji_CV_zh; do
            test -s "cv/${name}.pdf"
            cp "cv/${name}.pdf" "public/${name}.pdf"
          done
          cp cv/Jia-Hao_Ji_CV.pdf public/resume_long.pdf
      - name: Install locked dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Check RSS, SEO, languages and internal links
        run: npm run check:site
      - name: Install browser for visual review
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check desktop, mobile and no-JavaScript rendering
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python scripts/check-ui.py
      - name: Check legacy equations, diagrams and WebGL
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python scripts/check-legacy.py
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-review
          path: site-review/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v4
