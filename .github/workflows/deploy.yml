name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile curriculum vitae files
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            cv/Jia-Hao_Ji_CV.tex
            cv/Jia-Hao_Ji_Academic_CV.tex
          work_in_root_file_dir: true
          texlive_version: 2026
          os: debian

      - name: Stage verified CV files for the website
        shell: bash
        run: |
          set -euo pipefail
          test -s cv/Jia-Hao_Ji_CV.pdf
          test -s cv/Jia-Hao_Ji_Academic_CV.pdf
          cp cv/Jia-Hao_Ji_CV.pdf public/Jia-Hao_Ji_CV.pdf
          cp cv/Jia-Hao_Ji_CV.pdf public/resume_long.pdf
          cp cv/Jia-Hao_Ji_Academic_CV.pdf public/Jia-Hao_Ji_Academic_CV.pdf

      - name: Install, build, and upload website
        uses: withastro/action@v2

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
