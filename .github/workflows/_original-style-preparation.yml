name: Verify original-style upgrade
on:
  push:
    branches: [update/original-style-rss-photos]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check the static site
        run: |
          npm ci
          npm run build
          node --test tests/site.test.mjs
          python scripts/verify_site.py
      - name: Browser and image rendering checks
        env:
          QA_OUTPUT: ${{ runner.temp }}/site-qa
        run: |
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
          python scripts/visual_check.py
      - name: Retain rendered pages and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-style-qa
          path: |
            ${{ runner.temp }}/site-qa
            docs/medical-training-photo-sources.json
            dist/index.html
            dist/blog/compressed-modernity-medical-training/index.html
            dist/blog/compressed-modernity-medical-training-en/index.html
            dist/_astro
            dist/styles
            dist/images/compressed-modernity
            dist/images/profile
          if-no-files-found: warn
