name: Sync Markdown to WeChat Drafts

on:
  push:
    branches: [main]
    paths:
      - "src/content/blog/**/*.md"
  workflow_dispatch:
    inputs:
      post:
        description: "Markdown path, e.g. src/content/blog/example.md"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-wechat-draft:
    # WeChat API calls should come from a stable, allow-listed public IP.
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/wechat/requirements.txt

      - name: Install publisher dependencies
        run: pip install -r scripts/wechat/requirements.txt

      - name: Publish Markdown to WeChat draft box
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_AUTHOR: "复旦动物园"
          BLOG_BASE_URL: "https://jiahaoblog.com"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/wechat/publish.py --file "${{ inputs.post }}" --force
          else
            python scripts/wechat/publish.py --changed "${{ github.event.before }}" "${{ github.sha }}"
          fi
